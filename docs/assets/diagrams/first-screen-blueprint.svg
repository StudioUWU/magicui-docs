<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Actor Blueprint graph that creates and displays the MagicUI screen</title>
  <desc id="desc">Event BeginPlay creates WBP MagicUIScreen, passes its Magic UI Component and Player Controller, adds it to the viewport, sets Game and UI input mode, and shows the cursor.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0d1425"/><stop offset="1" stop-color="#17102a"/></linearGradient><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#314057"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#f1f4f9"/></marker><marker id="d" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#55c9de"/></marker></defs>
  <rect width="1400" height="650" rx="24" fill="url(#bg)"/><rect x="24" y="24" width="1352" height="602" rx="18" fill="url(#grid)"/>
  <text x="52" y="62" fill="#dfe8f8" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">BP_MagicUIHost · Event Graph</text>
  <g font-family="Inter,Segoe UI,sans-serif">
    <g><rect x="50" y="145" width="190" height="110" rx="9" fill="#612039" stroke="#d75b84"/><rect x="50" y="145" width="190" height="34" rx="9" fill="#8c2e50"/><text x="68" y="168" fill="#fff" font-size="15" font-weight="700">Event BeginPlay</text><circle cx="233" cy="208" r="6" fill="#fff"/></g>
    <g><rect x="310" y="105" width="270" height="250" rx="9" fill="#22526d" stroke="#58bdd7"/><rect x="310" y="105" width="270" height="36" rx="9" fill="#2a7392"/><text x="330" y="130" fill="#fff" font-size="15" font-weight="700">Create WBP_MagicUIScreen</text><circle cx="317" cy="208" r="6" fill="#fff"/><circle cx="573" cy="208" r="6" fill="#fff"/><text x="335" y="185" fill="#dce9f7" font-size="13">Owning Player</text><circle cx="317" cy="181" r="6" fill="#55c9de"/><text x="335" y="252" fill="#dce9f7" font-size="13">Magic UI Source</text><circle cx="317" cy="248" r="6" fill="#55c9de"/><text x="335" y="317" fill="#dce9f7" font-size="13">Return Value · ScreenWidget</text><circle cx="573" cy="313" r="6" fill="#55c9de"/></g>
    <g><rect x="650" y="145" width="200" height="130" rx="9" fill="#24583d" stroke="#5fc58d"/><rect x="650" y="145" width="200" height="36" rx="9" fill="#347c55"/><text x="671" y="170" fill="#fff" font-size="15" font-weight="700">Add to Viewport</text><circle cx="657" cy="208" r="6" fill="#fff"/><circle cx="843" cy="208" r="6" fill="#fff"/><circle cx="657" cy="246" r="6" fill="#55c9de"/><text x="676" y="251" fill="#dce9f7" font-size="13">ScreenWidget</text></g>
    <g><rect x="920" y="125" width="250" height="185" rx="9" fill="#24583d" stroke="#5fc58d"/><rect x="920" y="125" width="250" height="36" rx="9" fill="#347c55"/><text x="941" y="150" fill="#fff" font-size="15" font-weight="700">Set Input Mode Game and UI</text><circle cx="927" cy="208" r="6" fill="#fff"/><circle cx="1163" cy="208" r="6" fill="#fff"/><circle cx="927" cy="246" r="6" fill="#55c9de"/><text x="946" y="251" fill="#dce9f7" font-size="13">Player Controller</text><circle cx="927" cy="281" r="6" fill="#55c9de"/><text x="946" y="286" fill="#dce9f7" font-size="13">Widget to Focus</text></g>
    <g><rect x="1225" y="145" width="135" height="130" rx="9" fill="#24583d" stroke="#5fc58d"/><rect x="1225" y="145" width="135" height="36" rx="9" fill="#347c55"/><text x="1244" y="169" fill="#fff" font-size="14" font-weight="700">Show Cursor</text><circle cx="1232" cy="208" r="6" fill="#fff"/><text x="1245" y="246" fill="#dce9f7" font-size="13">true ✓</text></g>
    <g><rect x="145" y="420" width="245" height="100" rx="9" fill="#2b3a53" stroke="#7188aa"/><text x="169" y="453" fill="#9fb2cc" font-size="12" font-weight="700">GET PLAYER CONTROLLER</text><text x="169" y="489" fill="#fff" font-size="16">Player Index 0</text><circle cx="383" cy="487" r="6" fill="#55c9de"/></g>
    <g><rect x="480" y="430" width="245" height="90" rx="9" fill="#2b3a53" stroke="#7188aa"/><text x="504" y="463" fill="#9fb2cc" font-size="12" font-weight="700">ACTOR COMPONENT</text><text x="504" y="496" fill="#fff" font-size="16">MagicUIComponent</text><circle cx="718" cy="494" r="6" fill="#55c9de"/></g>
  </g>
  <path d="M240 208H308" stroke="#fff" stroke-width="3" marker-end="url(#a)"/><path d="M580 208H648" stroke="#fff" stroke-width="3" marker-end="url(#a)"/><path d="M850 208H918" stroke="#fff" stroke-width="3" marker-end="url(#a)"/><path d="M1170 208H1223" stroke="#fff" stroke-width="3" marker-end="url(#a)"/>
  <path d="M383 487 C430 487 395 181 315 181" fill="none" stroke="#55c9de" stroke-width="3" marker-end="url(#d)"/><path d="M718 494 C780 494 760 390 612 390 C420 390 390 248 315 248" fill="none" stroke="#55c9de" stroke-width="3" marker-end="url(#d)"/>
  <path d="M573 313 C620 313 620 246 655 246" fill="none" stroke="#55c9de" stroke-width="3" marker-end="url(#d)"/><path d="M573 313 C750 405 840 281 925 281" fill="none" stroke="#55c9de" stroke-width="3" marker-end="url(#d)"/><path d="M383 487 C950 590 1180 355 1228 245" fill="none" stroke="#55c9de" stroke-width="2" opacity=".75"/>
  <text x="700" y="593" fill="#98abc8" font-family="Inter,Segoe UI,sans-serif" font-size="15" text-anchor="middle">Simplified Blueprint-style diagram. Use the named nodes and pins in the steps above.</text>
</svg>
