<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Actor Blueprint graph that creates a MagicUI screen with Toggle Magic UI</title>
  <desc id="desc">Event BeginPlay creates the WBP MagicUIScreen widget, passes its Player Controller and Magic UI Component, then calls Toggle Magic UI with the stored widget. The toggle adds it to the viewport, uses Game and UI input, and shows the cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0d1425"/><stop offset="1" stop-color="#17102a"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#314057"/></pattern>
    <marker id="exec" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#f1f4f9"/></marker>
    <marker id="data" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#55c9de"/></marker>
    <marker id="result" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#9b7bed"/></marker>
  </defs>
  <rect width="1500" height="760" rx="24" fill="url(#bg)"/>
  <rect x="24" y="24" width="1452" height="712" rx="18" fill="url(#grid)"/>
  <text x="52" y="62" fill="#dfe8f8" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700">BP_MagicUIHost · Alternative BeginPlay Graph</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <g>
      <rect x="45" y="150" width="185" height="108" rx="9" fill="#612039" stroke="#d75b84"/>
      <rect x="45" y="150" width="185" height="34" rx="9" fill="#8c2e50"/>
      <text x="63" y="173" fill="#fff" font-size="15" font-weight="700">Event BeginPlay</text>
      <circle cx="223" cy="210" r="6" fill="#fff"/>
    </g>

    <g>
      <rect x="295" y="105" width="300" height="265" rx="9" fill="#22526d" stroke="#58bdd7"/>
      <rect x="295" y="105" width="300" height="36" rx="9" fill="#2a7392"/>
      <text x="315" y="130" fill="#fff" font-size="15" font-weight="700">Create WBP_MagicUIScreen</text>
      <circle cx="302" cy="210" r="6" fill="#fff"/>
      <circle cx="588" cy="210" r="6" fill="#fff"/>
      <circle cx="302" cy="182" r="6" fill="#55c9de"/>
      <text x="320" y="187" fill="#dce9f7" font-size="13">Owning Player</text>
      <circle cx="302" cy="250" r="6" fill="#55c9de"/>
      <text x="320" y="255" fill="#dce9f7" font-size="13">Magic UI Source</text>
      <circle cx="588" cy="326" r="6" fill="#55c9de"/>
      <text x="320" y="331" fill="#dce9f7" font-size="13">Return Value · ScreenWidget</text>
    </g>

    <g>
      <rect x="690" y="82" width="500" height="478" rx="10" fill="#244f3b" stroke="#61c88e"/>
      <rect x="690" y="82" width="500" height="40" rx="10" fill="#347c55"/>
      <text x="712" y="109" fill="#fff" font-size="17" font-weight="700">MagicUIComponent · Toggle Magic UI</text>
      <circle cx="697" cy="138" r="6" fill="#fff"/>
      <circle cx="1183" cy="138" r="6" fill="#fff"/>

      <circle cx="697" cy="170" r="6" fill="#55c9de"/><text x="716" y="175" fill="#dce9f7" font-size="13">Target · MagicUIComponent</text>
      <circle cx="697" cy="210" r="6" fill="#55c9de"/><text x="716" y="215" fill="#dce9f7" font-size="13">Widget Reference · ScreenWidget</text>
      <circle cx="697" cy="250" r="6" fill="#55c9de"/><text x="716" y="255" fill="#dce9f7" font-size="13">Player Controller · Player 0</text>

      <text x="716" y="292" fill="#aeeac7" font-size="12" font-weight="700">SHOWN / HIDDEN VISIBILITY</text>
      <text x="716" y="318" fill="#fff" font-size="14">Visible  /  Collapsed</text>
      <text x="716" y="357" fill="#aeeac7" font-size="12" font-weight="700">INPUT MODE WHEN SHOWN / HIDDEN</text>
      <text x="716" y="383" fill="#fff" font-size="14">Game and UI  /  Game Only</text>
      <text x="716" y="422" fill="#aeeac7" font-size="12" font-weight="700">SHOW CURSOR WHEN SHOWN / HIDDEN</text>
      <text x="716" y="448" fill="#fff" font-size="14">true  /  false</text>
      <text x="716" y="487" fill="#aeeac7" font-size="12" font-weight="700">ADD TO VIEWPORT IF NEEDED</text>
      <text x="716" y="513" fill="#fff" font-size="14">true</text>

      <circle cx="1183" cy="442" r="6" fill="#9b7bed"/>
      <text x="1022" y="447" fill="#fff" font-size="13">Success</text>
      <circle cx="1183" cy="487" r="6" fill="#9b7bed"/>
      <text x="1022" y="492" fill="#fff" font-size="13">Is Now Shown</text>
    </g>

    <g>
      <rect x="1235" y="365" width="220" height="150" rx="9" fill="#2b3a53" stroke="#7188aa"/>
      <text x="1258" y="397" fill="#9fb2cc" font-size="12" font-weight="700">CHECK OUTPUTS</text>
      <circle cx="1242" cy="432" r="6" fill="#9b7bed"/>
      <text x="1260" y="437" fill="#fff" font-size="15">Success</text>
      <circle cx="1242" cy="464" r="6" fill="#9b7bed"/>
      <text x="1260" y="469" fill="#fff" font-size="15">Is Now Shown</text>
      <text x="1258" y="494" fill="#9fb2cc" font-size="12">Use state only on success</text>
    </g>

    <g>
      <rect x="20" y="610" width="240" height="90" rx="9" fill="#2b3a53" stroke="#7188aa"/>
      <text x="42" y="639" fill="#9fb2cc" font-size="12" font-weight="700">GET PLAYER CONTROLLER</text>
      <text x="42" y="678" fill="#fff" font-size="16">Player Index 0</text>
      <circle cx="253" cy="676" r="6" fill="#55c9de"/>
    </g>

    <g>
      <rect x="350" y="475" width="240" height="90" rx="9" fill="#2b3a53" stroke="#7188aa"/>
      <text x="374" y="504" fill="#9fb2cc" font-size="12" font-weight="700">ACTOR COMPONENT</text>
      <text x="374" y="543" fill="#fff" font-size="16">MagicUIComponent</text>
      <circle cx="583" cy="541" r="6" fill="#55c9de"/>
    </g>
  </g>

  <path d="M230 210H293" fill="none" stroke="#fff" stroke-width="3" marker-end="url(#exec)"/>
  <path d="M595 210 H615 V138 H688" fill="none" stroke="#fff" stroke-width="3" marker-end="url(#exec)"/>

  <path d="M583 541 H630 V170 H695" fill="none" stroke="#55c9de" stroke-width="3" marker-end="url(#data)"/>
  <path d="M622 326 H638" fill="none" stroke="#11162a" stroke-width="8"/>
  <path d="M588 326 H650 V210 H695" fill="none" stroke="#55c9de" stroke-width="3" marker-end="url(#data)"/>
  <path d="M253 676 H275 V182 H300" fill="none" stroke="#55c9de" stroke-width="3" marker-end="url(#data)"/>
  <path d="M253 676 H290 V590 H670 V250 H695" fill="none" stroke="#55c9de" stroke-width="3" marker-end="url(#data)"/>
  <path d="M583 541 H610 V400 H290 V250 H300" fill="none" stroke="#55c9de" stroke-width="3" marker-end="url(#data)"/>
  <path d="M1183 442 H1210 V432 H1240" fill="none" stroke="#9b7bed" stroke-width="2.5" marker-end="url(#result)"/>
  <path d="M1183 487 H1218 V464 H1240" fill="none" stroke="#9b7bed" stroke-width="2.5" marker-end="url(#result)"/>

  <text x="940" y="704" fill="#98abc8" font-family="Inter,Segoe UI,sans-serif" font-size="15" text-anchor="middle">This replaces Add to Viewport, Set Input Mode, and Show Cursor from Option 1.</text>
</svg>
