<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Expected MagicUI project plugin layout</title>
  <desc id="desc">A folder tree showing MyGame.uproject beside Plugins, then MagicUI, with MagicUI.uplugin directly in that folder.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0d1425"/><stop offset="1" stop-color="#17102a"/></linearGradient><filter id="glow"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#875fff" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="600" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" fill="#eef3ff" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="700">Project-level installation</text>
  <text x="60" y="92" fill="#8fa1bf" font-family="Inter,Segoe UI,sans-serif" font-size="15">The .uplugin file must be directly inside Plugins/MagicUI.</text>
  <g font-family="Cascadia Mono,Consolas,monospace" font-size="20">
    <rect x="60" y="130" width="720" height="405" rx="18" fill="#121d32" stroke="#344866"/>
    <text x="98" y="178" fill="#d9e6fa">📁 MyGame/</text>
    <text x="145" y="224" fill="#93a6c5">├──</text><text x="210" y="224" fill="#f4f7ff">MyGame.uproject</text>
    <text x="145" y="270" fill="#93a6c5">├──</text><text x="210" y="270" fill="#d9e6fa">📁 Content/</text>
    <text x="145" y="316" fill="#93a6c5">└──</text><text x="210" y="316" fill="#d9e6fa">📁 Plugins/</text>
    <text x="238" y="362" fill="#93a6c5">└──</text><text x="303" y="362" fill="#d9e6fa">📁 MagicUI/</text>
    <rect x="320" y="382" width="390" height="52" rx="10" fill="#493096" stroke="#a98aff" filter="url(#glow)"/>
    <text x="345" y="416" fill="#fff" font-weight="700">MagicUI.uplugin</text>
    <text x="330" y="470" fill="#93a6c5">├── Binaries/</text>
    <text x="330" y="504" fill="#93a6c5">├── Content/ · Shaders/ · Source/</text>
  </g>
  <rect x="830" y="162" width="310" height="215" rx="18" fill="#18233a" stroke="#52d6a5"/>
  <circle cx="875" cy="208" r="23" fill="#247b61"/><path d="M863 208 l8 8 17 -20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="915" y="216" fill="#ecfff8" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">Correct</text>
  <text x="866" y="263" fill="#b9c9df" font-family="Inter,Segoe UI,sans-serif" font-size="16">One packaged plugin folder.</text>
  <text x="866" y="292" fill="#b9c9df" font-family="Inter,Segoe UI,sans-serif" font-size="16">No extra package-name level.</text>
  <text x="866" y="321" fill="#b9c9df" font-family="Inter,Segoe UI,sans-serif" font-size="16">Copy the complete distribution.</text>
  <rect x="830" y="405" width="310" height="100" rx="16" fill="#321b2b" stroke="#cf5f8d"/>
  <text x="860" y="445" fill="#ffd8e8" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">Do not mix unrelated source trees</text>
  <text x="860" y="475" fill="#d9aabe" font-family="Inter,Segoe UI,sans-serif" font-size="14">or individual native libraries.</text>
</svg>
