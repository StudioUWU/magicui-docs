<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">UMG Canvas Panel with a full-screen Magic UI child</title>
  <desc id="desc">A simplified Unreal Widget Designer diagram showing a Canvas Panel root and a MagicUIView child anchored to all four edges with zero offsets.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1c1730"/></linearGradient><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#26364f" stroke-width="1"/></pattern></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="50" rx="10" fill="#202b3d"/>
  <circle cx="57" cy="53" r="7" fill="#e3688d"/><circle cx="81" cy="53" r="7" fill="#ddb35b"/><circle cx="105" cy="53" r="7" fill="#59c99a"/>
  <text x="140" y="61" fill="#eef3ff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">WBP_MagicUIScreen · Designer</text>
  <rect x="28" y="94" width="265" height="558" rx="10" fill="#141e31" stroke="#30425e"/>
  <text x="53" y="130" fill="#9cafca" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">HIERARCHY</text>
  <rect x="47" y="151" width="226" height="46" rx="7" fill="#25344e"/>
  <text x="66" y="180" fill="#f3f6ff" font-family="Inter,Segoe UI,sans-serif" font-size="16">▾ Canvas Panel</text>
  <rect x="69" y="205" width="204" height="46" rx="7" fill="#4d337f" stroke="#9c7de5"/>
  <text x="89" y="234" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">MagicUIView</text>
  <text x="53" y="294" fill="#9cafca" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">SELECTED WIDGET</text>
  <text x="53" y="329" fill="#d9e5f8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Source Component</text><text x="253" y="329" fill="#f2b7d7" font-family="Inter,Segoe UI,sans-serif" font-size="14" text-anchor="end">runtime</text>
  <text x="53" y="365" fill="#d9e5f8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Resize View To Widget</text><text x="253" y="365" fill="#8fa4c2" font-family="Inter,Segoe UI,sans-serif" font-size="14" text-anchor="end">Off</text>
  <text x="53" y="401" fill="#d9e5f8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Preserve Aspect Ratio</text><text x="253" y="401" fill="#70dfb5" font-family="Inter,Segoe UI,sans-serif" font-size="14" text-anchor="end">On</text>
  <text x="53" y="454" fill="#9cafca" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">CANVAS PANEL SLOT</text>
  <text x="53" y="490" fill="#d9e5f8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Anchors</text><text x="253" y="490" fill="#70dfb5" font-family="Inter,Segoe UI,sans-serif" font-size="14" text-anchor="end">Full stretch</text>
  <text x="53" y="526" fill="#d9e5f8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Offsets L · T · R · B</text><text x="253" y="526" fill="#70dfb5" font-family="Inter,Segoe UI,sans-serif" font-size="14" text-anchor="end">0 · 0 · 0 · 0</text>
  <rect x="315" y="94" width="857" height="558" rx="10" fill="url(#grid)" stroke="#30425e"/>
  <text x="340" y="128" fill="#8194b3" font-family="Inter,Segoe UI,sans-serif" font-size="13">CANVAS PANEL</text>
  <rect x="368" y="151" width="751" height="446" rx="8" fill="#18112b" stroke="#a888ed" stroke-width="3"/>
  <rect x="385" y="168" width="717" height="412" rx="5" fill="#131c2e"/>
  <circle cx="744" cy="330" r="118" fill="#6d42d3" opacity=".16"/><circle cx="830" cy="382" r="87" fill="#cf5fa8" opacity=".12"/>
  <text x="744" y="337" fill="#f4efff" font-family="Inter,Segoe UI,sans-serif" font-size="36" font-weight="750" text-anchor="middle">Magic UI</text>
  <text x="744" y="372" fill="#a997cf" font-family="Inter,Segoe UI,sans-serif" font-size="16" text-anchor="middle">full-screen child · anchors stretched · offsets zero</text>
